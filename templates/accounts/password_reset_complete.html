{% extends "auth_base.html" %}

{% block title %}Password Reset Complete — QueueLess Nepal{% endblock %}

{% block extra_css %}
<style>
    /* password_reset_complete.html — page-specific liquid-glass polish */
    .fa-circle-check {
        animation: prcm-icon-pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) both, prcm-icon-glow 2.4s ease-in-out 0.5s infinite;
    }

    .auth-card h1, .auth-card__subtitle, .btn-primary.btn-block {
        animation: prcm-fade-up 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .auth-card__subtitle { animation-delay: 0.06s; }
    .btn-primary.btn-block { animation-delay: 0.12s; }

    @keyframes prcm-icon-pop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes prcm-icon-glow {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(34, 197, 94, 0)); }
        50% { filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6)); }
    }

    @keyframes prcm-fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .fa-circle-check { animation: none; }
    }
</style>
{% endblock %}

{% block content %}
<div style="text-align:center;">
    <i class="fa-solid fa-circle-check" style="font-size:2.5rem; color: var(--color-success); margin-bottom: var(--space-4); display:block;"></i>
    <h1>Password reset</h1>
    <p class="auth-card__subtitle">Your password has been set. You can now sign in.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Sign In</a>
</div>
{% endblock %}

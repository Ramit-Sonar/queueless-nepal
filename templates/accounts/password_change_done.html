{% extends "base.html" %}

{% block title %}Password Updated — QueueLess Nepal{% endblock %}

{% block extra_css %}
<style>
    /* password_change_done.html — page-specific liquid-glass polish */
    .card {
        animation: pcd-fade-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .fa-circle-check {
        animation: pcd-icon-pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both, pcd-icon-glow 2.4s ease-in-out 0.6s infinite;
    }

    @keyframes pcd-fade-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pcd-icon-pop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes pcd-icon-glow {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(34, 197, 94, 0)); }
        50% { filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6)); }
    }

    @media (prefers-reduced-motion: reduce) {
        .fa-circle-check { animation: none; }
    }
</style>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 0 auto; text-align:center;">
    <i class="fa-solid fa-circle-check" style="font-size:2.5rem; color: var(--color-success); margin-bottom: var(--space-4); display:block;"></i>
    <h1 style="font-size:1.2rem; margin-bottom: var(--space-2);">Password updated</h1>
    <p style="color: var(--color-text-secondary); margin-bottom: var(--space-5);">Your password has been changed successfully.</p>
    <a href="{% url 'accounts:profile' %}" class="btn btn-primary btn-block">Back to Profile</a>
</div>
{% endblock %}

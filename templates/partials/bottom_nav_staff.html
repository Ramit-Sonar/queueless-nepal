<style>
    /* bottom_nav_staff.html — internal liquid-glass polish */
    nav.bottom-nav {
        animation: bns-slide-up 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    nav.bottom-nav .bottom-nav__item i {
        transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    nav.bottom-nav .bottom-nav__item.is-active i {
        transform: translateY(-2px) scale(1.12);
    }

    nav.bottom-nav .bottom-nav__item:active {
        transform: scale(0.94);
    }

    @keyframes bns-slide-up {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        nav.bottom-nav { animation: none; }
    }
</style>
<nav class="bottom-nav">
    <a href="{% url 'staff:dashboard' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}">
        <i class="fa-solid fa-gauge-high"></i>
        <span>Dashboard</span>
    </a>
    <a href="{% url 'staff:book_token' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'book_token' %}is-active{% endif %}">
        <i class="fa-solid fa-ticket"></i>
        <span>Book</span>
    </a>
    <a href="{% url 'staff:reports' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'reports' %}is-active{% endif %}">
        <i class="fa-solid fa-chart-line"></i>
        <span>Reports</span>
    </a>
    <a href="{% url 'accounts:profile' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>
</nav>

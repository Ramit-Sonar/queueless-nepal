{% load static %}
<style>
    /* sidebar_staff.html — internal liquid-glass polish */
    aside.app-sidebar {
        animation: sbs-fade-right 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    aside.app-sidebar .app-header__brand img.brand-logo {
        transition: transform 0.3s ease;
    }

    aside.app-sidebar .app-header__brand:hover img.brand-logo {
        transform: scale(1.08) rotate(-4deg);
    }

    aside.app-sidebar .app-sidebar__link {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        animation: sbs-fade-in 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    aside.app-sidebar nav > a:nth-child(1) { animation-delay: 0.05s; }
    aside.app-sidebar nav > a:nth-child(2) { animation-delay: 0.1s; }
    aside.app-sidebar nav > a:nth-child(3) { animation-delay: 0.15s; }
    aside.app-sidebar nav > a:nth-child(4) { animation-delay: 0.2s; }

    aside.app-sidebar .app-sidebar__link:hover {
        background: rgba(37, 99, 235, 0.08);
        color: var(--color-primary);
        transform: translateX(4px);
    }

    aside.app-sidebar .app-sidebar__link.is-active {
        box-shadow: inset 3px 0 0 var(--color-primary);
    }

    @keyframes sbs-fade-right {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes sbs-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
        aside.app-sidebar, aside.app-sidebar .app-sidebar__link { animation: none; }
    }
</style>
<aside class="app-sidebar">
    <div class="app-header__brand" style="margin-bottom: var(--space-5); padding-left: var(--space-4);">
        <img src="{% static 'img/logo.png' %}" alt="QueueLess Nepal" class="brand-logo">
        <span>Staff</span>
    </div>
    <nav>
        <a href="{% url 'staff:dashboard' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
        <a href="{% url 'staff:book_token' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'book_token' %}is-active{% endif %}">
            <i class="fa-solid fa-ticket"></i> Book Token
        </a>
        <a href="{% url 'staff:reports' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'reports' %}is-active{% endif %}">
            <i class="fa-solid fa-chart-line"></i> Reports
        </a>
        <a href="{% url 'accounts:profile' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}">
            <i class="fa-solid fa-user"></i> Profile
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" style="margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-border);">
            {% csrf_token %}
            <button type="submit" class="app-sidebar__link" style="width:100%; text-align:left; background:none; border:none; cursor:pointer; font-size:1rem; color: var(--color-danger);">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </button>
        </form>
    </nav>
</aside>

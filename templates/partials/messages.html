{% if messages %}
<style>
    /* messages.html — internal liquid-glass polish */
    .alert {
        backdrop-filter: blur(8px);
        animation: msg-slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        position: relative;
        overflow: hidden;
    }

    .alert::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: currentColor;
        opacity: 0.6;
    }

    @keyframes msg-slide-in {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .alert { animation: none; }
    }
</style>
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
{% endif %}

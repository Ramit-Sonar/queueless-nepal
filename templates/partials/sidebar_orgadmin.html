{% load static %}
<style>
    /* sidebar_orgadmin.html — internal liquid-glass polish */
    aside.app-sidebar {
        animation: sbo-fade-right 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    aside.app-sidebar .app-header__brand img.brand-logo {
        transition: transform 0.3s ease;
    }

    aside.app-sidebar .app-header__brand:hover img.brand-logo {
        transform: scale(1.08) rotate(-4deg);
    }

    aside.app-sidebar .app-sidebar__link {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        animation: sbo-fade-in 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    aside.app-sidebar nav > a:nth-child(1) { animation-delay: 0.03s; }
    aside.app-sidebar nav > a:nth-child(2) { animation-delay: 0.06s; }
    aside.app-sidebar nav > a:nth-child(3) { animation-delay: 0.09s; }
    aside.app-sidebar nav > a:nth-child(4) { animation-delay: 0.12s; }
    aside.app-sidebar nav > a:nth-child(5) { animation-delay: 0.15s; }
    aside.app-sidebar nav > a:nth-child(6) { animation-delay: 0.18s; }
    aside.app-sidebar nav > a:nth-child(7) { animation-delay: 0.21s; }
    aside.app-sidebar nav > a:nth-child(8) { animation-delay: 0.24s; }
    aside.app-sidebar nav > a:nth-child(9) { animation-delay: 0.27s; }
    aside.app-sidebar nav > a:nth-child(10) { animation-delay: 0.30s; }

    aside.app-sidebar .app-sidebar__link:hover {
        background: rgba(37, 99, 235, 0.08);
        color: var(--color-primary);
        transform: translateX(4px);
    }

    aside.app-sidebar .app-sidebar__link.is-active {
        box-shadow: inset 3px 0 0 var(--color-primary);
    }

    @keyframes sbo-fade-right {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes sbo-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
        aside.app-sidebar, aside.app-sidebar .app-sidebar__link { animation: none; }
    }
</style>
<aside class="app-sidebar">
    <div class="app-header__brand" style="margin-bottom: var(--space-5); padding-left: var(--space-4);">
        <img src="{% static 'img/logo.png' %}" alt="QueueLess Nepal" class="brand-logo">
        <span>Org Admin</span>
    </div>
    <nav>
        <a href="{% url 'organizations:dashboard' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
        <a href="{% url 'organizations:profile' %}" class="app-sidebar__link {% if request.resolver_match.view_name == 'organizations:profile' %}is-active{% endif %}">
            <i class="fa-solid fa-building"></i> Organization Profile
        </a>
        <a href="{% url 'organizations:departments' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'departments' %}is-active{% endif %}">
            <i class="fa-solid fa-sitemap"></i> Departments
        </a>
        <a href="{% url 'organizations:services' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'services' %}is-active{% endif %}">
            <i class="fa-solid fa-list-check"></i> Services
        </a>
        <a href="{% url 'qr_generator:generate' %}" class="app-sidebar__link {% if request.resolver_match.namespace == 'qr_generator' %}is-active{% endif %}">
            <i class="fa-solid fa-qrcode"></i> QR Code
        </a>
        <a href="{% url 'organizations:queues' %}" class="app-sidebar__link {% if 'queue' in request.resolver_match.url_name %}is-active{% endif %}">
            <i class="fa-solid fa-people-line"></i> Queues
        </a>
        <a href="{% url 'organizations:staff_list' %}" class="app-sidebar__link {% if 'staff' in request.resolver_match.url_name %}is-active{% endif %}">
            <i class="fa-solid fa-id-badge"></i> Staff
        </a>
        <a href="{% url 'organizations:reports' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'reports' %}is-active{% endif %}">
            <i class="fa-solid fa-chart-line"></i> Reports
        </a>
        <a href="{% url 'organizations:settings' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'settings' %}is-active{% endif %}">
            <i class="fa-solid fa-gear"></i> Settings
        </a>
        <a href="{% url 'accounts:profile' %}" class="app-sidebar__link {% if request.resolver_match.view_name == 'accounts:profile' %}is-active{% endif %}" style="margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-border);">
            <i class="fa-solid fa-user"></i> My Account
        </a>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="app-sidebar__link" style="width:100%; text-align:left; background:none; border:none; cursor:pointer; font-size:1rem; color: var(--color-danger);">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </button>
        </form>
    </nav>
</aside>

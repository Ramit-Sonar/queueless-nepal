{% load static %}
<style>
    /* sidebar.html (customer) — internal liquid-glass polish */
    aside.app-sidebar {
        animation: sb-fade-right 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    aside.app-sidebar .app-header__brand img.brand-logo {
        transition: transform 0.3s ease;
    }

    aside.app-sidebar .app-header__brand:hover img.brand-logo {
        transform: scale(1.08) rotate(-4deg);
    }

    aside.app-sidebar .app-sidebar__link {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        animation: sb-fade-in 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    aside.app-sidebar nav > a:nth-child(1) { animation-delay: 0.04s; }
    aside.app-sidebar nav > a:nth-child(2) { animation-delay: 0.08s; }
    aside.app-sidebar nav > a:nth-child(3) { animation-delay: 0.12s; }
    aside.app-sidebar nav > a:nth-child(4) { animation-delay: 0.16s; }
    aside.app-sidebar nav > a:nth-child(5) { animation-delay: 0.2s; }

    aside.app-sidebar .app-sidebar__link:hover {
        background: rgba(37, 99, 235, 0.08);
        color: var(--color-primary);
        transform: translateX(4px);
    }

    aside.app-sidebar .app-sidebar__link.is-active {
        box-shadow: inset 3px 0 0 var(--color-primary);
    }

    @keyframes sb-fade-right {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes sb-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
        aside.app-sidebar, aside.app-sidebar .app-sidebar__link { animation: none; }
    }
</style>
<aside class="app-sidebar">
    <div class="app-header__brand" style="margin-bottom: var(--space-5); padding-left: var(--space-4);">
        <img src="{% static 'img/logo.png' %}" alt="QueueLess Nepal" class="brand-logo">
        <span>QueueLess Nepal</span>
    </div>
    <nav>
        <a href="{% url 'customers:home' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'home' %}is-active{% endif %}">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="{% url 'customers:scan' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'scan' %}is-active{% endif %}">
            <i class="fa-solid fa-qrcode"></i> Scan QR
        </a>
        <a href="{% url 'customers:token_history' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'token_history' %}is-active{% endif %}">
            <i class="fa-solid fa-list-check"></i> My Tokens
        </a>
        <a href="{% url 'customers:notifications' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'notifications' %}is-active{% endif %}">
            <i class="fa-regular fa-bell"></i> Notifications
        </a>
        <a href="{% url 'accounts:profile' %}" class="app-sidebar__link {% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}">
            <i class="fa-solid fa-user"></i> Profile
        </a>
    </nav>
</aside>
